name: Publier une version Windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Installer Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Construire l’installeur
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\Build-Installer.ps1 -Version $version

      - name: Exécuter les tests de contrôle
        shell: powershell
        run: dotnet run --project .\tests\PersonalAppsHub.SmokeTests\PersonalAppsHub.SmokeTests.csproj -c Release --source https://api.nuget.org/v3/index.json

      - name: Publier dans GitHub Releases
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $installer = ".\artifacts\installer\PersonalAppsHub-Setup-$version-x64.exe"
          gh release create "${{ github.ref_name }}" $installer --generate-notes --verify-tag
